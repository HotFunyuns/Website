# The single workflow that builds and deploys this site to GitHub Pages.
#
# There used to be two — this one and `deploy.yml` — both triggered by a push to
# `main` and both sharing the `pages` concurrency group. Because the group is
# repo-scoped, they did not race: they serialised, so every push ran two full
# builds and two deployments of the same artifact, roughly doubling deploy time
# (this site is ~230 pages), and whichever finished second was the one that
# actually went live. They also pinned different `deploy-pages` versions (v4 and
# v5), so which of the two won was not something the history made obvious.
# `deploy.yml` was deleted; this file is the survivor because it is the one that
# has been maintained (it restores the Next build cache and is on the current
# action versions).
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      # Uses the package script rather than `next build` directly so the
      # unpublished-content gate in scripts/validate-content.mjs also runs here.
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      # Deletes the URL surfaces the export emits that GitHub Pages would serve
      # at HTTP 200 with no possible canonical: the per-route RSC flight payload
      # (`<route>/index.txt`, a text/plain copy of every page's prose) and the
      # `404/` directory, a soft 404 duplicating the real `404.html` handler.
      # Idempotent, so it is harmless if `npm run build` already ran it.
      - name: Normalise published URLs
        run: node scripts/postbuild-normalize-urls.mjs

      # Canonicalisation is the only signal this host can send, so a broken
      # canonical is a deploy-blocking defect rather than a warning. These read
      # `out/` only and take a couple of seconds.
      - name: Audit canonicals and URL surface
        run: |
          node scripts/audit-canonicals.mjs
          node scripts/audit-redirects.mjs
          node scripts/audit-duplicate-content.mjs

      # Authorship and dates run inside `npm run build`. These add the entity
      # naming check and the test suite (queue rules, DST edges, the linking
      # pass, a full release rehearsal on a temporary copy of the content).
      - name: Audit entity naming and run tests
        run: |
          node scripts/audit-entities.mjs
          npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
